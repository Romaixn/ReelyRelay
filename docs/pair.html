<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelyRelay - Send to your TV</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A1815">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1A1815;
    color: #DFD7D0;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 460px; margin: 0 auto; padding: 32px 22px 64px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; color: #F5EFE9; font-weight: 600; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; }
  h1 { margin: 0 0 10px; color: #F5EFE9; font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
  p { margin: 0 0 24px; color: #B1A8A1; }
  label { display: block; margin-bottom: 8px; color: #857C75; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  input[type=text] {
    width: 100%;
    padding: 15px 16px;
    border: 1px solid #534F4A;
    border-radius: 12px;
    background: #221F1C;
    color: #F5EFE9;
    font: 17px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  input[type=text]:focus { outline: 2px solid #F2EBE0; outline-offset: 2px; }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: #F2EBE0;
    color: #1D1A17;
    font: 600 17px "Plus Jakarta Sans", system-ui, sans-serif;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #F2EBE0; outline-offset: 3px; }
  button:disabled, input:disabled { opacity: 0.5; cursor: default; }
  #status { min-height: 1.6em; margin: 22px 0 0; color: #B1A8A1; }
  #status.error { color: #E0A672; }
  #status.success { color: #6EBA85; }
  .fine { margin-top: 36px; color: #857C75; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="img/icon.svg" alt="">ReelyRelay</div>

  <h1>Send to your TV</h1>
  <p id="hint">Paste the value below and tap Send. It fills in on your TV on its own - no typing with the remote.</p>

  <label for="value" id="label">Value</label>
  <input type="text" id="value" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="send">Send to TV</button>
  <p id="status" role="status"></p>

  <p class="fine">Sent once through ntfy.sh to a random, single-use channel that only your TV is listening on.</p>
</main>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var topic = params.get("topic");
  var label = params.get("label");
  var statusEl = document.getElementById("status");
  var input = document.getElementById("value");
  var button = document.getElementById("send");

  // label says what is being asked for (e.g. "Your TMDB key") - see
  // PhonePairing.pairingUrl() in the app. Falls back to the generic wording
  // above when absent (an older or hand-typed link).
  if (label) {
    document.title = "ReelyRelay - Send " + label;
    document.getElementById("label").textContent = label;
    document.getElementById("hint").textContent =
        "Paste it below and tap Send. It fills in on your TV on its own - no typing with the remote.";
  }

  if (!topic) {
    statusEl.textContent = "This link is missing its pairing code. Go back to your TV and scan the QR code again.";
    statusEl.className = "error";
    input.disabled = true;
    button.disabled = true;
    return;
  }

  function send() {
    var value = input.value.trim();
    if (!value) {
      input.focus();
      return;
    }
    button.disabled = true;
    statusEl.textContent = "Sending…";
    statusEl.className = "";

    // mode: "no-cors" deliberately: this page only needs to SEND the
    // value, never read ntfy's response, so it works regardless of
    // whether ntfy.sh sets permissive CORS headers.
    fetch("https://ntfy.sh/" + encodeURIComponent(topic), {
      method: "POST",
      mode: "no-cors",
      body: value
    }).then(function () {
      statusEl.textContent = "Sent. You can close this page and go back to your TV.";
      statusEl.className = "success";
      input.value = "";
      button.disabled = false;
    }).catch(function () {
      statusEl.textContent = "Couldn't send. Check your connection and try again.";
      statusEl.className = "error";
      button.disabled = false;
    });
  }

  button.addEventListener("click", send);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      send();
    }
  });
})();
</script>
</body>
</html>
