# Builds, signs and publishes a release when a version tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The APK is always attached as ReelyRelay.apk - the in-app updater takes
# the release's .apk asset, and the install guide links to
# releases/latest/download/ReelyRelay.apk.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   TMDB_API_KEY              the key bundled into the app
#   RELEASE_KEYSTORE_BASE64   the signing keystore:  base64 -w0 release.jks
#   RELEASE_STORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The in-app updater compares the release tag with the installed
      # versionName, so a tag that doesn't match would offer the "update"
      # forever.
      - name: Check the tag matches versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "versionName = \"$version\"" app/build.gradle.kts; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName in app/build.gradle.kts"
            exit 1
          fi

      # gradle/gradle-daemon-jvm.properties pins the Gradle daemon to Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Decode the signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Test and build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ReelyRelay.apk
          gh release create "$GITHUB_REF_NAME" ReelyRelay.apk \
            --title "ReelyRelay ${GITHUB_REF_NAME#v}" \
            --generate-notes
